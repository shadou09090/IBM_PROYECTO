<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmartCare Clinic</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" href="/assets/css/style.css">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" href="/assets/css/adminDashboard.css">
</head>
<body>
    <div id="appHeader"></div>

    <main class="container">
        <div class="section-header">
            <h1 class="heading-accent">Admin <span>Dashboard</span></h1>
            <button type="button" id="openAddDoctorBtn" class="btn btn-primary">+ Add Doctor</button>
        </div>

        <div id="adminAlert" class="alert" role="alert"></div>

        <section class="filter-bar admin-controls" aria-label="Doctor filters">
            <div class="admin-filter-group">
                <input type="text" id="searchDoctorInput" class="form-control" placeholder="Search doctor by name...">
                <select id="filterTimeSelect" class="form-control">
                    <option value="">All Time Periods</option>
                    <option value="AM">Morning (AM)</option>
                    <option value="PM">Afternoon (PM)</option>
                </select>
                <select id="filterSpecialtySelect" class="form-control">
                    <option value="">All Specialties</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Dermatology">Dermatology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="General Medicine">General Medicine</option>
                </select>
                <button type="button" id="resetFiltersBtn" class="btn btn-outline">Reset</button>
            </div>
        </section>

        <section id="doctorGrid" class="card-grid" aria-live="polite"></section>
    </main>

    <div id="addDoctorModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addDoctorTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="addDoctorTitle" class="heading-accent">Add <span>Doctor</span></h3>
                <button type="button" class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div id="addDoctorAlert" class="alert" role="alert"></div>
            <form id="addDoctorForm">
                <div class="form-group">
                    <label for="docName">Full Name</label>
                    <input type="text" id="docName" class="form-control" required minlength="2" maxlength="100"
                           placeholder="Dr. Jane Doe">
                </div>
                <div class="form-group">
                    <label for="docSpecialty">Specialty</label>
                    <input type="text" id="docSpecialty" class="form-control" required minlength="2" maxlength="100"
                           placeholder="Cardiology">
                </div>
                <div class="form-group">
                    <label for="docEmail">Email</label>
                    <input type="email" id="docEmail" class="form-control" required placeholder="doctor@clinic.com">
                </div>
                <div class="form-group">
                    <label for="docPhone">Phone</label>
                    <input type="text" id="docPhone" class="form-control" required placeholder="555-010-2000">
                </div>
                <div class="form-group">
                    <label for="docPassword">Password</label>
                    <input type="password" id="docPassword" class="form-control" required minlength="6"
                           placeholder="Minimum 6 characters">
                </div>
                <div class="form-group">
                    <label>Available Time Slots</label>
                    <div class="time-checkbox-grid">
                        <label class="time-checkbox-item">
                            <input type="checkbox" name="availableTimes" value="09:00 AM - 10:00 AM"> 09:00 AM - 10:00 AM
                        </label>
                        <label class="time-checkbox-item">
                            <input type="checkbox" name="availableTimes" value="10:00 AM - 11:00 AM"> 10:00 AM - 11:00 AM
                        </label>
                        <label class="time-checkbox-item">
                            <input type="checkbox" name="availableTimes" value="11:00 AM - 12:00 PM"> 11:00 AM - 12:00 PM
                        </label>
                        <label class="time-checkbox-item">
                            <input type="checkbox" name="availableTimes" value="01:00 PM - 02:00 PM"> 01:00 PM - 02:00 PM
                        </label>
                        <label class="time-checkbox-item">
                            <input type="checkbox" name="availableTimes" value="02:00 PM - 03:00 PM"> 02:00 PM - 03:00 PM
                        </label>
                        <label class="time-checkbox-item">
                            <input type="checkbox" name="availableTimes" value="03:00 PM - 04:00 PM"> 03:00 PM - 04:00 PM
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Doctor</button>
            </form>
        </div>
    </div>

    <script type="module" th:src="@{/js/adminDashboard.js}" src="/js/adminDashboard.js"></script>
</body>
</html>
