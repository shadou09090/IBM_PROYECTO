<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal - SmartCare Clinic</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div id="appHeader"></div>

    <main class="container">
        <div class="section-header">
            <h1 class="heading-accent">Find <span>Doctors</span></h1>
            <a href="/pages/patientRecord.html" class="btn btn-primary">View My Records</a>
        </div>

        <div id="patientAlert" class="alert" role="alert"></div>

        <section class="filter-bar" aria-label="Doctor filters">
            <input type="text" id="searchDoctorInput" class="form-control" placeholder="Search doctor by name...">
            <select id="filterTimeSelect" class="form-control">
                <option value="">All Time Periods</option>
                <option value="AM">Morning (AM)</option>
                <option value="PM">Afternoon (PM)</option>
            </select>
            <select id="filterSpecialtySelect" class="form-control">
                <option value="">All Specialties</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Dermatology">Dermatology</option>
                <option value="Neurology">Neurology</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="General Medicine">General Medicine</option>
            </select>
            <button type="button" id="resetFiltersBtn" class="btn btn-outline">Reset</button>
        </section>

        <section id="doctorGrid" class="card-grid" aria-live="polite"></section>

        <section style="margin-top: 3rem;">
            <div class="section-header">
                <h2 class="heading-accent">My <span>Appointments</span></h2>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Doctor</th>
                            <th>Specialty</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="myAppointmentsBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="bookModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="bookModalTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="bookModalTitle" class="heading-accent">Book <span>Appointment</span></h3>
                <button type="button" class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div id="bookAlert" class="alert" role="alert"></div>
            <form id="bookForm">
                <input type="hidden" id="bookDoctorId">
                <div class="form-group">
                    <label for="bookDoctorName">Doctor</label>
                    <input type="text" id="bookDoctorName" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label for="bookDate">Appointment Date</label>
                    <input type="date" id="bookDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="bookSlot">Available Time Slot</label>
                    <select id="bookSlot" class="form-control" required>
                        <option value="">Select a date first</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script type="module" src="/js/patientDashboard.js"></script>
</body>
</html>
