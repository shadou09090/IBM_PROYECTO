name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML templates and static pages
        run: npx --yes htmlhint "app/src/main/resources/static/**/*.html" "app/src/main/resources/templates/**/*.html"

      - name: Validate JavaScript module syntax
        run: |
          find app/src/main/resources/static/js -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Lint CSS stylesheets
        run: |
          npm install --no-save stylelint stylelint-config-standard
          npx stylelint "app/src/main/resources/static/assets/css/**/*.css" --config <(echo '{"extends":"stylelint-config-standard","rules":{"no-descending-specificity":null}}')
        shell: bash
