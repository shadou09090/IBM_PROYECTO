name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: app/pom.xml

      - name: Run Checkstyle
        working-directory: app
        run: mvn -B checkstyle:check

      - name: Compile and Test-Compile
        working-directory: app
        run: mvn -B clean compile test-compile
